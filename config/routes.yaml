app:
    resource: '../src/Controller/'
    type: attribute
    prefix: /

frontend:
    resource: "routes/frontend.yml"

app_backend:
    resource: "routes/backend.yml"
    prefix: /admin

app_api:
    resource: "routes/api.yml"
    prefix: /api
    defaults:
        _format: json

# Routes of the operations declared with #[AsResource] on the entities.
# Loaded after the YAML routes, so that /jeux-de-societe/les-sorties wins over /jeux-de-societe/{slug}
sylius_resource:
    resource: 'sylius.symfony.routing.loader.resource'
    type: service

_liip_imagine:
    resource: "@LiipImagineBundle/Resources/config/routing.yaml"
