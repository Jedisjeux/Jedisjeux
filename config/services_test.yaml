parameters:
    locale: 'en_US'

services:
    Symfony\Component\HttpFoundation\Session\SessionFactoryInterface: '@session.factory'

    # Behat runs the kernel from the CLI, where Symfony renders the errors as text instead of the Twig error pages
    error_renderer.default: '@error_renderer.html'

    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $minkParameters: '@behat.mink.parameters'
            $mailerPool: '@test.mailer_pool'

    App\Tests\Behat\:
        resource: '../tests/Behat/*'

    App\Tests\Behat\Bridge\Service\EmailChecker:
        arguments:
            $cache: '@test.mailer_pool'

    App\Tests\Behat\Bridge\Service\MessageSendCacher:
        arguments:
            $cache: '@test.mailer_pool'

    App\Tests\Behat\Bridge\Service\EmailCheckerInterface: '@App\Tests\Behat\Bridge\Service\EmailChecker'
    App\Tests\Behat\Bridge\Service\NotificationCheckerInterface: '@App\Tests\Behat\Bridge\Service\NotificationChecker'

    App\Tests\Behat\Bridge\Service\SecurityServiceInterface: '@App\Tests\Behat\Service\SecurityService'
