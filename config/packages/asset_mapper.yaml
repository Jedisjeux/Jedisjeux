framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            assets/: ''
            # Stimulus controllers of the Bootstrap Admin UI bundle (theme switcher, copy to clipboard), see config/packages/stimulus.yaml
            vendor/sylius/bootstrap-admin-ui/assets/controllers: sylius-bootstrap-admin-ui/controllers
        excluded_patterns:
            # Read by UX Icons, not served as assets
            - '*/assets/icons/*'
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
