name: CI

on:
  push: ~
  pull_request: ~
  release:
    types: [created]
  schedule:
    -
      cron: "0 1 * * 6" # Run at 1am every Saturday

env:
  # The tasks reach the containers directly, the global Caddy router is not needed
  CASTOR_DOCKER_ROUTER_AUTOSTART: 0

jobs:
  static-checks:
    runs-on: ubuntu-latest

    name: "Static checks"

    steps:
      -
        uses: actions/checkout@v4

      -
        name: Setup Castor
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: castor
          coverage: none

      -
        name: Build the builder image
        # Created beforehand so Docker does not create the mounted home as root
        run: |
          mkdir -p .home
          castor docker:build app-builder

      -
        name: Install PHP dependencies
        run: castor app:install
        id: end-of-setup

      -
        name: Validate composer.json
        run: castor app:composer validate --strict
        if: always() && steps.end-of-setup.outcome == 'success'

      -
        name: Check for security vulnerabilities
        run: castor app:composer audit --locked
        # Known advisories of api-platform/core 2.x cannot be fixed without upgrading to API Platform 3
        continue-on-error: true
        if: always() && steps.end-of-setup.outcome == 'success'

      -
        name: Validate coding standard
        run: castor app:qa:cs fix --dry-run --diff
        if: always() && steps.end-of-setup.outcome == 'success'

      -
        name: Validate Twig templates
        run: castor app:symfony lint:twig templates
        if: always() && steps.end-of-setup.outcome == 'success'

      -
        name: Validate Yaml files
        run: castor app:symfony lint:yaml config --parse-tags
        if: always() && steps.end-of-setup.outcome == 'success'

      -
        name: Run Psalm
        run: castor app:qa:psalm
        if: always() && steps.end-of-setup.outcome == 'success'

      -
        name: Run PHPStan
        run: castor app:qa:phpstan
        if: always() && steps.end-of-setup.outcome == 'success'

  test-application:
    runs-on: ubuntu-latest

    name: "Test application"

    timeout-minutes: 30

    steps:
      -
        uses: actions/checkout@v4

      -
        name: Setup Castor
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: castor
          coverage: none

      -
        name: Build and start the stack
        # Created beforehand so Docker does not create the mounted home as root
        run: |
          mkdir -p .home
          castor docker:build
          castor docker:up

      -
        name: Install PHP dependencies
        run: castor app:install

      -
        name: Build assets
        run: castor app:assets

      -
        name: Prepare application database
        run: |
          castor app:symfony --env=test doctrine:database:create
          castor app:symfony --env=test doctrine:migrations:migrate -n

      -
        name: Validate Doctrine mapping
        run: castor app:symfony --env=test doctrine:schema:validate

      -
        name: Test provided migrations
        run: |
          castor app:symfony --env=test doctrine:migrations:migrate first --no-interaction
          castor app:symfony --env=test doctrine:migrations:migrate latest --no-interaction

      -
        name: Test installer
        run: castor app:symfony --env=test app:install --no-interaction

      -
        name: Load fixtures
        run: castor app:symfony --env=test sylius:fixtures:load --no-interaction

      -
        name: Warmup cache
        run: castor app:symfony --env=test cache:warmup

      -
        name: Run PHPSpec
        run: castor test:phpspec -f dot

      -
        name: Run PHPUnit
        run: castor test:phpunit

      -
        name: Run CLI Behat
        run: castor test:behat --colors --strict -f progress --tags="@cli&&~@todo" || castor test:behat --strict -f progress --tags="@cli&&~@todo" --rerun

      -
        name: Run non-JS Behat
        run: castor test:behat --colors --strict -f progress --tags="~@javascript&&~@todo&&~@cli" || castor test:behat --strict -f progress --tags="~@javascript&&~@todo&&~@cli" --rerun

      -
        name: Run JS Behat
        run: castor test:behat --colors --strict -f progress --tags="@javascript&&~@todo&&~@cli" || castor test:behat --colors --strict -f progress --tags="@javascript&&~@todo&&~@cli" --rerun || castor test:behat --colors --strict -f progress --tags="@javascript&&~@todo&&~@cli" --rerun

      -
        name: Upload Behat logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "Behat logs"
          path: etc/build/
          if-no-files-found: ignore

      -
        name: Upload Symfony logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "Symfony logs"
          path: var/log/
          if-no-files-found: ignore
