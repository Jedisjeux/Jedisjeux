name: Deploy

on:
  # No staging environment: every push on main that passes the CI goes live
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: ~

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    name: "Deploy to production"

    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    environment:
      name: production
      url: https://www.jedisjeux.net

    steps:
      -
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      -
        name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      -
        name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      -
        name: Add production host to known hosts
        run: echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      -
        name: Deploy
        run: bundle exec cap production deploy
        env:
          # The commit the CI tested, not whatever main points to by now
          BRANCH: ${{ github.event.workflow_run.head_sha || github.ref_name }}
